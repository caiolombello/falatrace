name: Offline validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
          no-cache: true
      - name: Synthetic media dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg rsync
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run desktop:check
      - run: bun run lint
      - run: bash scripts/test-offline.sh
      - run: bun run build
  studio-journeys:
    # Renders the real Studio QML offscreen with PySide6 against synthetic bridges:
    # no device, provider, network service or real configuration is touched.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
          no-cache: true
      - name: Synthetic media and Qt runtime libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0 fonts-dejavu-core
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: PySide6 for the offscreen QML runner (pinned by hash)
        run: |
          python3 -m venv "$RUNNER_TEMP/qt"
          "$RUNNER_TEMP/qt/bin/python" -m pip install --require-hashes --no-deps -r scripts/studio-requirements.txt
      - name: Studio journeys
        env:
          FALATRACE_QML_PYTHON: ${{ runner.temp }}/qt/bin/python
        run: bash scripts/test-studio-journeys.sh "$RUNNER_TEMP/journeys"
